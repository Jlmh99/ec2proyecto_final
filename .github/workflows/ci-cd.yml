name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGEN: ${{ secrets.DOCKERHUB_USERNAME }}/proyecto-usuarios
  OO_URL: http://${{ secrets.EC2_HOST }}:5080
  OO_USER: ${{ secrets.OPENOBSERVE_USER }}
  OO_PASS: ${{ secrets.OPENOBSERVE_PASSWORD }}

jobs:
  # ------------------------------------------------------------------ 1. pruebas
  test:
    name: Pruebas (backend y frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      estado: ${{ steps.resultado.outputs.estado }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias y Chromium
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium
          mkdir -p reportes

      - name: Pruebas de backend (pytest, cobertura mínima 70 %)
        id: backend
        run: pytest tests/api --cov=app --cov-fail-under=70 --junitxml=reportes/backend.xml

      - name: Pruebas de frontend y API con Playwright
        id: frontend
        run: pytest tests/e2e --junitxml=reportes/e2e.xml --html=reportes/e2e.html --self-contained-html

      - name: Registrar resultado de las pruebas en OpenObserve
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then DESPLIEGUE=permitido; else DESPLIEGUE=bloqueado; fi
          python scripts/registrar_evento.py --evento pruebas --estado "${{ job.status }}" \
            --junit "reportes/*.xml" --extra despliegue=$DESPLIEGUE

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: reportes/
          retention-days: 14

  # ------------------------------------------------------------------ 2. imagen (solo si pasaron las pruebas)
  build-and-push:
    name: Construir y publicar imagen
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ 3. despliegue por SSH (solo si todo lo anterior pasó)
  deploy:
    name: Desplegar en AWS EC2
    needs: [test, build-and-push]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copiar docker-compose.yml a la instancia
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: /home/${{ secrets.EC2_USER }}/proyecto

      - name: Actualizar contenedores
        id: despliegue
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ env.IMAGEN }}:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_IMAGE
          script_stop: true
          script: |
            cd ~/proyecto
            test -f .env || { echo "Falta ~/proyecto/.env"; exit 1; }
            docker compose pull
            docker compose up -d --remove-orphans
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:8080/api/health; then echo; echo "Aplicacion saludable"; OK=1; break; fi
              sleep 3
            done
            if [ -z "$OK" ]; then docker compose logs --tail 40 app; exit 1; fi
            docker image prune -f

      - name: Registrar el despliegue en OpenObserve
        if: always()
        run: |
          python scripts/registrar_evento.py --evento despliegue --estado "${{ job.status }}" \
            --extra imagen="${{ env.IMAGEN }}:${{ github.sha }}" servidor="${{ secrets.EC2_HOST }}"
