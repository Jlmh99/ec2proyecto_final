{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section class="tarjeta">
  <h1 id="titulo">Iniciar sesión</h1>
  <form id="form-login" novalidate>
    <label for="email">Correo</label>
    <input id="email" name="email" type="email" autocomplete="username">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button id="btn-login" type="submit">Entrar</button>
  </form>
  <p id="mensaje" class="mensaje" role="alert"></p>
  <p>¿No tienes cuenta? <a id="enlace-registro" href="/register">Regístrate</a></p>
</section>
{% endblock %}
{% block scripts %}
<script>
document.getElementById("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await peticion("/api/auth/login", "POST", {
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
  });
  if (r.ok) {
    guardarSesion(r.cuerpo.data.token, r.cuerpo.data.usuario);
    window.location.href = "/usuarios";
  } else {
    mostrarMensaje(r.cuerpo.data.error, true);
  }
});
</script>
{% endblock %}
