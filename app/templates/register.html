{% extends "base.html" %}
{% block titulo %}Registro{% endblock %}
{% block contenido %}
<section class="tarjeta">
  <h1 id="titulo">Crear cuenta</h1>
  <form id="form-registro" novalidate>
    <label for="nombre">Nombre</label>
    <input id="nombre" name="nombre" type="text" autocomplete="name">
    <label for="email">Correo</label>
    <input id="email" name="email" type="email" autocomplete="email">
    <label for="password">Contraseña (mínimo 8 caracteres)</label>
    <input id="password" name="password" type="password" autocomplete="new-password">
    <button id="btn-registro" type="submit">Registrarme</button>
  </form>
  <p id="mensaje" class="mensaje" role="alert"></p>
  <p>¿Ya tienes cuenta? <a id="enlace-login" href="/login">Inicia sesión</a></p>
</section>
{% endblock %}
{% block scripts %}
<script>
document.getElementById("form-registro").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await peticion("/api/auth/register", "POST", {
    nombre: document.getElementById("nombre").value,
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
  });
  if (r.ok) {
    mostrarMensaje("Cuenta creada correctamente. Ya puedes iniciar sesión.", false);
    document.getElementById("form-registro").reset();
  } else {
    mostrarMensaje(r.cuerpo.data.error, true);
  }
});
</script>
{% endblock %}
